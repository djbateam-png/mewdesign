name: Extraire ItemsAdder

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Décompresser le pack
        run: |
          rm -rf extrait
          mkdir -p extrait
          unzip -o "ItemsAdder (3).zip" -d extrait

      - name: Enregistrer les fichiers extraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extrait
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer"
          else
            git commit -m "Extraction du pack ItemsAdder"
            git push
          fi
